<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>

        body{
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        form{
            background-color: #2d2d2d;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 5px;
        }

        button{
            background-color: orange;
            border: none;
            padding: 10px;
            width: 100%;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h1>Formulario de Registro</h1>

    <form>

        <input type="text" placeholder="Nombre">

        <input type="email" placeholder="Correo">

        <input type="password" placeholder="Contraseña">

        <button>Registrar</button>

    </form>

</body>
</html>
